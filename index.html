<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Daily Loose-End Digest · Kanban — Archive</title>
<link rel="stylesheet" href="styles.css?v=3">
<style>
  .archive { padding: 18px; max-width: 640px; margin: 0 auto; }
  .archive h2 { font-size: 16px; margin: 0 0 12px; }
  .archive ul { list-style: none; padding: 0; margin: 0; }
  .archive li {
    background: #fff; border: 1px solid #e4e7ec; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px;
  }
  .archive li a { font-weight: 600; color: #0a66c2; text-decoration: none; font-size: 15px; }
  .archive li .d { color: #5e6c84; font-size: 13px; margin-left: auto; }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-size: 13px; }
  .pager button { border: 1px solid #c8d7ee; background:#fff; color:#0a66c2; border-radius:6px;
                  padding: 6px 12px; cursor:pointer; font-weight:600; }
  .pager button:disabled { opacity:.4; cursor:default; }
  .pager .info { color:#5e6c84; }
  .empty { color:#5e6c84; font-size:13px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Daily Loose-End Digest · Kanban</h1>
  <span class="tag">archive index</span>
  <span class="note">one board per day — newest first · mock data</span>
</div>

<div class="archive">
  <h2>Archives <span class="info" id="range" style="font-weight:400;color:#5e6c84;font-size:13px"></span></h2>
  <ul id="list"></ul>
  <div class="pager">
    <button id="prev" type="button">&#8592; Newer</button>
    <span class="info" id="pageinfo"></span>
    <button id="next" type="button">Older &#8594;</button>
  </div>
  <div id="emptybar" class="empty"></div>
</div>

<script>
// Generated by emit_kanban.py — one entry per archived day, newest first.
var DAYS = [
  { date: '2026-08-20', label: 'Wed 20 Aug 2026' },
  { date: '2026-08-19', label: 'Tue 19 Aug 2026' }
];
var PAGE = 14; // days per page

(function () {
  var page = 0;
  var list = document.getElementById('list');
  var pager = { pageinfo: document.getElementById('pageinfo'),
                prev: document.getElementById('prev'), next: document.getElementById('next'),
                range: document.getElementById('range'),
                emptybar: document.getElementById('emptybar') };
  var pages = Math.max(1, Math.ceil(DAYS.length / PAGE));

  function render() {
    list.innerHTML = '';
    var slice = DAYS.slice(page * PAGE, page * PAGE + PAGE);
    slice.forEach(function (d) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = 'day/' + d.date + '/';
      a.textContent = d.label;
      li.appendChild(a);
      var sp = document.createElement('span');
      sp.className = 'd';
      sp.textContent = d.date;
      li.appendChild(sp);
      list.appendChild(li);
    });
    var start = page * PAGE + 1, end = Math.min(DAYS.length, (page + 1) * PAGE);
    pager.pageinfo.textContent = (DAYS.length === 0) ? 'no entries'
      : 'Showing ' + start + '\u2013' + end + ' of ' + DAYS.length;
    pager.prev.disabled = (page === 0);
    pager.next.disabled = (page >= pages - 1);
    pager.range.textContent = (DAYS.length > PAGE) ? '' : '';
  }

  pager.prev.addEventListener('click', function () { if (page > 0) { page--; render(); } });
  pager.next.addEventListener('click', function () { if (page < pages - 1) { page++; render(); } });
  render();
})();
</script>

</body>
</html>
